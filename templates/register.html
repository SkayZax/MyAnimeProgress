<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription - MyAnimeProgress</title>
    <style>
        /* On reprend les mêmes styles que ton login.html */
        html { background-color: #141414; font-family: sans-serif; }
        body { margin: 0; color: white; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 20px; color: white; }
        header h1 { grid-column: 2; justify-self: center; margin: 0; }
        .main-content { display: flex; justify-content: center; align-items: center; flex-grow: 1; padding: 20px; }
        .login-container { background-color: #222222; padding: 40px; border-radius: 12px; border: 1px solid black; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
        .login-container:hover { border: 1px solid #ff0000; box-shadow: 0 15px 40px #ff0000; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #333; background-color: #333; color: white; }
        input:focus { outline: none; border-color: #ff0000; }
        .btn-login { background-color: #ff0000; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header><h1>MyAnimeProgress</h1></header>
    <hr style="border: 1px solid #ff0000; width: 100%; margin: 0;">

    <div class="main-content">
        <form action="/register" method="post" class="login-container">
            <h2 style="text-align: center;">Inscription</h2>

            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" required placeholder="Votre pseudo">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="votre@email.com">
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required placeholder="Choisissez un mot de passe">
            </div>

            <button type="submit" class="btn-login">Créer mon compte</button>
            <div style="text-align: center; margin-top: 10px;">
                <a href="/login" style="color: white; text-decoration: none; font-size: 0.9em;">Déjà un compte ? Se connecter</a>
            </div>
        </form>
    </div>
</body>
</html>
