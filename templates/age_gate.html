<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contenu adulte — Vérification</title>
    <style>
        html, body { margin:0; padding:0; background:#141414; color:white; font-family: sans-serif; }
        .wrap { max-width: 720px; margin: 60px auto; padding: 0 16px; }
        .card { background:#222; border:1px solid #ff0000; border-radius: 14px; padding: 22px; }
        h1 { margin-top:0; color:#ff0000; }
        p { color:#d1d5db; line-height: 1.6; }
        .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top: 18px; }
        .btn { cursor:pointer; border-radius:10px; padding:10px 14px; font-weight:700; border:1px solid #ff0000; }
        .btn-primary { background:#ff0000; color:white; }
        .btn-secondary { background:transparent; color:white; text-decoration:none; display:inline-block; }
        .small { font-size: 12px; color:#9ca3af; margin-top: 14px; }
        code { background:#111; padding:2px 6px; border-radius:6px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Contenu adulte</h1>
            <p>
                Cette section peut afficher du contenu réservé aux personnes majeures.
                Confirme que tu as <strong>18 ans ou plus</strong> pour continuer.
            </p>

            <form method="post" action="{{ url_for('age_gate') }}">
                <input type="hidden" name="next" value="{{ next_url }}">
                <div class="actions">
                    <button class="btn btn-primary" type="submit" name="confirm" value="yes">J'ai 18+ — Continuer</button>
                    <a class="btn btn-secondary" href="{{ url_for('index') }}">Retour</a>
                </div>
            </form>

            <div class="small">
                Note: cette vérification est stockée dans ta <code>session</code> (cookie). Elle peut disparaître si tu vides tes cookies.
            </div>
        </div>
    </div>
</body>
</html>
