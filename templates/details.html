<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ anime['title'] }} - MyAnimeProgress</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { background-color: #141414; color: white; font-family: sans-serif; padding: 24px; margin: 0; }
        .detail-container { display: flex; gap: 40px; max-width: 1000px; margin: auto; background: #222; padding: 30px; border-radius: 15px; border: 1px solid #ff0000; }
        img { border-radius: 10px; width: 300px; max-width: 100%; height: auto; }
        .info h1 { color: #ff0000; margin-top: 0; }
        .synopsis { line-height: 1.6; color: #ccc; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: white; text-decoration: none; border: 1px solid #ff0000; padding: 10px; border-radius: 5px; }
        .favorite-btn { background: transparent; border: 1px solid #ff0000; color: #ff0000; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .favorite-btn:hover { background: #ff0000; color: white; }
        .title-row { display: flex; align-items: center; gap: 12px; }

        select, button, input { font: inherit; }
        select { max-width: 100%; }

        @media (max-width: 768px) {
            body { padding: 14px; }
            .detail-container { flex-direction: column; gap: 18px; padding: 18px; }
            img { width: 100%; max-width: 420px; }
            .title-row { flex-wrap: wrap; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <a href="{{ url_for('index') }}" class="btn-back">← Retour à l'accueil</a>

    <div class="detail-container">
        <img src="{{ anime['images']['jpg']['large_image_url'] }}" alt="{{ anime['title'] }}">
        <div class="info">
            <div class="title-row">
                <h1 style="margin:0;">{{ anime['title'] }}</h1>
                <form action="{{ url_for('toggle_favorite') }}" method="POST" style="margin:0;">
                    <input type="hidden" name="anime_id" value="{{ anime.mal_id }}">
                    <input type="hidden" name="total_episode" value="{{ anime.episodes }}">
                    <button type="submit" class="favorite-btn" title="Ajouter aux favoris">
                        {% if is_favorite %}★ Favori{% else %}☆ Favori{% endif %}
                    </button>
                </form>
            </div>
            <p><strong>Score :</strong> ⭐ {{ anime['score'] }}</p>
            <p><strong>Épisodes :</strong> {{ anime['episodes'] }}</p>
            <p><strong>Statut :</strong> {{ anime['status'] }}</p>
            <div class="synopsis">
                <h3>Synopsis</h3>
                <p>{{ anime['synopsis'] }}</p>
                <label>Saison :</label>
<select onchange="window.location.href='/anime/' + this.value">
    <option value="{{ anime.mal_id }}" selected>{{ anime.title }} (Actuelle)</option>
    {% for s in seasons %}
        <option value="{{ s.mal_id }}">{{ s.name }}</option>
    {% endfor %}
</select>

<form action="/add_to_list" method="POST">
    <input type="hidden" name="anime_id" value="{{ anime.mal_id }}">
    <input type="hidden" name="total_episode" value="{{ anime.episodes }}">

    <label>Épisode actuel :</label>
    <select name="current_episode">
        {% for i in range(1, (anime.episodes or 0) + 1) %}
            <option value="{{ i }}">Épisode {{ i }}</option>
        {% endfor %}
    </select>

    <button type="submit">Enregistrer ma progression</button>
</form>
            </div>
        </div>
    </div>
</body>
</html>
